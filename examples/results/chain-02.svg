<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="312" viewBox="0 0 1100 312" role="img"><title>终端需求收缩与利润影响边界</title><desc>演示终端 → 演示加工 → 演示原料</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#466481"/></marker></defs><rect width="1100" height="312" rx="16" fill="#f4f7fb"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="34" y="44" font-size="23" fill="#172b45">终端需求收缩与利润影响边界</text><path d="M155.0,122.0 L468.0,122.0" fill="none" stroke="#9aacc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M605.0,122.0 L918.0,122.0" fill="none" stroke="#9aacc0" stroke-width="2" marker-end="url(#arrow)"/><rect x="24.0" y="90.0" width="132" height="64" rx="10" fill="#ffffff" stroke="#a2b4c6"/><text data-node="raw" x="90.0" y="127.0" text-anchor="middle" font-size="16" fill="#172b45">演示原料</text><rect x="474.0" y="90.0" width="132" height="64" rx="10" fill="#fbe7e6" stroke="#a2b4c6"/><text data-node="assembly" x="540.0" y="127.0" text-anchor="middle" font-size="16" fill="#172b45">演示加工</text><rect x="924.0" y="90.0" width="132" height="64" rx="10" fill="#e2f3ec" stroke="#a2b4c6"/><text data-node="brand" x="990.0" y="127.0" text-anchor="middle" font-size="16" fill="#172b45">演示终端</text><text x="34" y="210" font-size="16" fill="#304b66">逆向传导：演示终端 → 演示加工 → 演示原料</text><text x="34" y="248" font-size="14" fill="#304b66">演示终端→演示加工 中依赖55分（结构推断）；演示加工→演示原料 弱依赖45分（结构推断）</text><text x="34" y="294" font-size="13" fill="#52687d">风险值仅用于链内比较；红色为最高节点，绿色为最低节点。</text></g></svg>